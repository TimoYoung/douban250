name: Build, Push and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: timoyoung/douban250

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          DATE_TAG=$(date -u +%Y%m%d)
          echo "tag=${DATE_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.tag }}
          name: v${{ steps.meta.outputs.tag }}
          body: |
            ## Docker Image

            ```
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ```

            ## Changes

            ${{ github.event.head_commit.message }}
          generate_release_notes: true
